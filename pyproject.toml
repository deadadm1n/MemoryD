[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memoryd"
version = "0.7.0"
description = "A portable, model-independent memory runtime"
requires-python = ">=3.11"

[project.scripts]
memoryd = "memoryd.cli:main"

[tool.setuptools.packages.find]
include = ["memoryd*"]
